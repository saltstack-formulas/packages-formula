verifier:
  # https://www.inspec.io/
  name: inspec
  sudo: true
  reporter:
    # cli, documentation, html, progress, json, json-min, json-rspec, junit
    - cli

suites:
  - name: debian
    includes:
      - debian-11-3006-12
      - debian-11-3007-4
      - debian-11-master
      - debian-12-3006-12
      - debian-12-3007-4
      - debian-12-master
    provisioner:
      dependencies:
        - name: node
          repo: git
          source: https://github.com/saltstack-formulas/node-formula.git
      state_top:
        base:
          '*':
            - packages._mapdata
            - node
            - packages
      pillars:
        top.sls:
          base:
            '*':
              - packages
      pillars_from_files:
        packages.sls: test/salt/pillar/debian.sls
    verifier:
      inspec_tests:
        - path: test/integration/default
  - name: ubuntu
    includes:
      - ubuntu-2004-3006-12
      - ubuntu-2004-3007-4
      - ubuntu-2004-master
      - ubuntu-2204-3006-12
      - ubuntu-2204-3007-4
      - ubuntu-2204-master
      - ubuntu-2404-3006-12
      - ubuntu-2404-3007-4
      - ubuntu-2404-master
    provisioner:
      dependencies:
        - name: golang
          repo: git
          source: https://github.com/saltstack-formulas/golang-formula.git
      state_top:
        base:
          '*':
            - packages._mapdata
            - golang.package
            - packages
      pillars:
        top.sls:
          base:
            '*':
